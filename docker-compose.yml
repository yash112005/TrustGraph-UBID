version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trustgraph
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:4.4
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4JLABS_PLUGINS: '["gds"]'
    ports:
      - "7474:7474"
      - "7687:7687"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://user:password@db/trustgraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    ports:
      - "8000:8000"
    depends_on:
      - db
      - neo4j

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
